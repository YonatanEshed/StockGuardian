services:
    postgres:
        image: postgres:16-alpine
        container_name: db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-pipeline} -d ${POSTGRES_DB:-stock_pipeline}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    pgadmin:
        image: dpage/pgadmin4:latest
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASSWORD}
        ports:
            - '5050:80'
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        depends_on:
            - postgres

    restapi:
        build:
            context: ./services/RestApi
        image: stockguardian-restapi:latest
        restart: unless-stopped
        ports:
            - '8080:8080'
        environment:
            POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stock_pipeline}
            POSTGRES_USER: ${POSTGRES_USER:-admin}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
        depends_on:
            - postgres

volumes:
    postgres_data:
    pgadmin_data:
